<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>aispace | 授权管理</title><style>body{margin:0;background:#f4f5f9;color:#181922;font:16px system-ui}header{background:white;padding:22px 3%;display:flex;justify-content:space-between;border-bottom:1px solid #ddd}main{padding:32px 3%}section{background:white;border:1px solid #d4d7e3;border-radius:9px;padding:26px}h1{margin:0;font-size:24px}h2{margin-top:0}form{display:flex;gap:24px;align-items:end}label{display:grid;gap:10px;flex:1}input{padding:13px;border:1px solid #bbc0d2;border-radius:6px;font:inherit;min-width:0}button{font:inherit;cursor:pointer;padding:10px 16px;color:#4034bf;background:white;border:1px solid #aaa;border-radius:6px}button.primary{background:#483bc6;color:white;padding:14px 24px;border:0}button:disabled{opacity:.4;cursor:default}#result{background:#e8edfc;padding:22px;margin-top:24px;border-radius:8px}code{font-size:22px;overflow-wrap:anywhere}table{width:100%;border-collapse:collapse;background:white}th,td{padding:18px;text-align:left;border-bottom:1px solid #ddd}th{background:#e9ebf1}td button{border:0;padding:6px}.danger{color:#c82030}.toolbar{display:flex;justify-content:space-between;margin-top:30px}#message{color:#a32630}dialog{border:1px solid #bbb;border-radius:10px;padding:28px}dialog form{display:grid}small{display:block;color:#626574;margin-top:16px}.table{overflow:auto}.device-info{max-width:260px;overflow-wrap:anywhere}.identifier{font-family:monospace;font-size:13px;overflow-wrap:anywhere;max-width:230px}@media(max-width:700px){form{display:grid}}</style><header><h1>aispace | 授权管理</h1><span>管理员　 <button id="logout">退出</button></span></header><main><section><h2>新建授权</h2><form id="create"><label>客户备注（选填）<input id="note" maxlength="500" placeholder="例如：张先生 / 南山门店"></label><label>到期时间（北京时间）<input id="expires" type="datetime-local" required></label><button class="primary">生成授权码</button></form><div id="result" hidden><h3>授权码已生成</h3><code id="code"></code> <button id="copy">复制授权码</button><small>请复制并保存，离开或刷新页面后无法再次查看</small></div></section><p id="message" role="alert"></p><div class="toolbar"><h2>授权列表</h2><button id="refresh">刷新</button></div><div class="table"><table><thead><tr><th>客户备注</th><th>授权编号</th><th>到期时间（北京时间）</th><th>绑定设备</th><th>状态</th><th>操作</th></tr></thead><tbody></tbody></table></div><small>解绑和禁用在客户端后续校验时生效。已有短期权限最多延续至最后成功校验后30分钟或授权到期，两者取早。</small></main><dialog><form id="renew"><h2>续期</h2><p id="old"></p><label>新到期时间（北京时间）<input id="newexpires" type="datetime-local" required></label><p id="renewerror" role="alert"></p><button class="primary">确认续期</button><button type="button" id="cancel">取消</button></form></dialog><script>
let csrf='',now=0,selected=null,requestId=crypto.randomUUID();const $=s=>document.querySelector(s),date=v=>new Date(v*1000).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}),epoch=v=>Date.parse(v+':00+08:00')/1000;async function api(path,body){let r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:body?JSON.stringify(body):undefined});if(r.status===401){location.reload();throw Error('请重新登录')}let data=await r.json();if(!r.ok)throw Error(data.detail||'操作失败');return data}function message(s){$('#message').textContent=s}function copyButton(value,label){let b=document.createElement('button');b.textContent=label;b.onclick=async()=>{try{await navigator.clipboard.writeText(value);message('已复制')}catch(e){message('复制失败，请手动选择复制')}};return b}async function refresh(){try{let d=await api('/api/licenses');csrf=d.csrf;now=d.now;$('tbody').replaceChildren();for(let r of d.licenses){let tr=document.createElement('tr');for(let value of [r.note||'—',r.id,date(r.expires),r.bound?'已绑定':'未绑定',!r.enabled?'已禁用':r.expires<=now?'已到期':'有效']){let td=document.createElement('td');td.textContent=value;tr.append(td)}tr.children[1].className='identifier';tr.children[1].append(copyButton(r.id,'复制编号'));let deviceCell=tr.children[3];deviceCell.className='device-info';if(r.bound){let name=document.createElement('div');name.textContent=r.device_name||'设备名称待同步';deviceCell.replaceChildren(name);let digest=document.createElement('div');digest.className='identifier';digest.textContent=r.device.slice(0,12)+'…'+r.device.slice(-8);digest.title=r.device;deviceCell.append(digest,copyButton(r.device,'复制设备标识'))}let td=document.createElement('td');for(let [action,label,disabled]of [['renew','续期',false],['unbind','解绑',!r.bound],['disable','禁用',!r.enabled]]){let b=document.createElement('button');b.textContent=label;b.disabled=disabled;if(action==='disable')b.className='danger';b.onclick=async()=>{if(action==='renew'){selected=r;$('#old').textContent=`${r.note||'无备注'} / ${r.id} 原到期时间：${date(r.expires)}`;$('#newexpires').value='';$('#renewerror').textContent='';$('dialog').showModal();return}if(!confirm(`确认${label} ${r.note||'无备注'} / ${r.id}？\n${action==='unbind'?'成功后等待新设备激活。':''}客户端后续校验时生效；已有短期权限最多至最后校验后30分钟或授权到期，两者取早。`))return;b.disabled=true;try{await api(`/api/licenses/${r.id}/${action}`,{});message(label+'成功');await refresh()}catch(e){message(e.message);b.disabled=disabled}};td.append(b)}tr.append(td);$('tbody').append(tr)}}catch(e){message(e.message)}}$('#create').onsubmit=async e=>{e.preventDefault();let b=e.submitter;b.disabled=true;message('');try{let data=await api('/api/licenses',{note:$('#note').value,expires:epoch($('#expires').value),request_id:requestId});$('#code').textContent=data.code;$('#result').hidden=false;requestId=crypto.randomUUID();await refresh()}catch(e){message(e.message+'；如果连接中断或结果不明，请先刷新核对列表，不要重新创建。')}finally{b.disabled=false}};$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText($('#code').textContent);message('已复制授权码')}catch(e){message('复制失败，请手动选择并复制授权码')}};$('#refresh').onclick=refresh;$('#logout').onclick=async()=>{try{await api('/logout',{});location.reload()}catch(e){message(e.message)}};$('#cancel').onclick=()=>$('dialog').close();$('#renew').onsubmit=async e=>{e.preventDefault();let b=e.submitter;b.disabled=true;try{await api(`/api/licenses/${selected.id}/renew`,{expires:epoch($('#newexpires').value)});$('dialog').close();message('续期成功');await refresh()}catch(e){$('#renewerror').textContent=e.message}finally{b.disabled=false}};refresh();
</script></html>
