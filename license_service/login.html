<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>aispace 授权管理登录</title><style>body{font:16px system-ui;background:#f3f4f8;display:grid;place-items:center;height:90vh}form{background:white;padding:40px;border-radius:10px}input,button{padding:12px;margin:10px}button{background:#483bc6;color:white;border:0}</style><form><h1>aispace | 授权管理</h1><label>管理员密码<input type="password" autocomplete="current-password" required></label><button>登录</button><p role="alert"></p></form><script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();let b=document.querySelector('button');b.disabled=true;try{let r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Login':'1'},body:JSON.stringify({password:document.querySelector('input').value})});if(!r.ok)throw Error((await r.json()).detail);location.reload()}catch(e){document.querySelector('p').textContent=e.message}finally{b.disabled=false}}</script></html>
